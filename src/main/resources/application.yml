spring:
  application:
    name: citas-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:citas_fcv_training_R.P.V}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:citas_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  # Zona de la hora local de pared de la agenda (ISO-8601 sin offset en la API).
  time-zone: ${APP_TIME_ZONE:America/Bogota}
  security:
    issuer: citas-api
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  automation:
    # Clave de n8n para /api/v1/automation/** (cabecera X-Automation-Key). Vacía = ruta cerrada (401).
    api-key: ${AUTOMATION_API_KEY:}
  password-reset:
    # Solo laboratorio local: true devuelve developmentToken en la respuesta. Nunca en despliegues compartidos.
    expose-development-token: ${PASSWORD_RESET_EXPOSE_DEV_TOKEN:false}
    token-minutes: ${PASSWORD_RESET_TOKEN_MINUTES:30}

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
